<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイページ | 楽しい暗記サイト</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+JP:wght@400;700&family=Outfit:wght@700;900&display=swap"
        rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/animations.css">

    <style>
        .profile-header {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
            border-radius: var(--radius-lg);
            padding: 2rem;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .avatar-circle {
            width: 80px;
            height: 80px;
            background: var(--gradient-primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
        }

        .profile-info h2 {
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .edit-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.9rem;
        }

        .edit-btn:hover {
            color: var(--text-main);
        }

        /* ストリーク表示 */
        .streak-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .streak-card {
            background: linear-gradient(135deg, rgba(255, 165, 0, 0.15), rgba(255, 69, 0, 0.1));
            border: 1px solid rgba(255, 165, 0, 0.3);
            border-radius: var(--radius-md);
            padding: 1rem;
            text-align: center;
        }

        .streak-icon {
            font-size: 1.5rem;
            display: block;
            margin-bottom: 0.3rem;
        }

        .streak-value {
            font-size: 2rem;
            font-weight: 900;
            color: #ffa500;
            display: block;
        }

        .streak-label {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* 過去最高記録 */
        .streak-best {
            font-size: 0.7rem;
            color: rgba(255, 165, 0, 0.6);
            margin-top: 0.4rem;
            display: block;
        }

        /* 現在値がベスト値と一致するとき強調 */
        .streak-card.is-best .streak-value {
            color: #ffcc00;
            text-shadow: 0 0 10px rgba(255, 200, 0, 0.5);
        }

        .streak-card.is-best {
            border-color: rgba(255, 200, 0, 0.5);
            background: linear-gradient(135deg, rgba(255, 165, 0, 0.25), rgba(255, 69, 0, 0.15));
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            background: rgba(0, 0, 0, 0.2);
            padding: 1.5rem;
            border-radius: var(--radius-md);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--accent-cyan);
            margin: 0.5rem 0;
            display: block;
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .section-title {
            margin-bottom: 1.5rem;
            border-left: 4px solid var(--accent-purple);
            padding-left: 1rem;
            font-size: 1.5rem;
        }

        .badge-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 1rem;
            margin-bottom: 3rem;
        }

        .badge-item {
            background: rgba(255, 255, 255, 0.03);
            border-radius: var(--radius-md);
            padding: 1rem;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s;
            opacity: 0.5;
            filter: grayscale(100%);
        }

        .badge-item.unlocked {
            opacity: 1;
            filter: grayscale(0%);
            border-color: var(--accent-pink);
            background: rgba(255, 0, 85, 0.1);
        }

        .badge-icon {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 0.5rem;
        }

        .badge-name {
            font-size: 0.8rem;
            font-weight: bold;
        }

        /* お気に入りリスト */
        .favorites-list {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            margin-bottom: 3rem;
        }

        .fav-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 1.2rem;
            border-radius: var(--radius-md);
            display: flex;
            flex-direction: column;
            gap: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .fav-item-info {
            display: flex;
            align-items: center;
            gap: 1rem;
            justify-content: space-between;
        }

        .fav-actions {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
            width: 100%;
        }

        .fav-actions a {
            padding: 8px 4px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: bold;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        
        .fav-actions a:hover {
            transform: translateY(-2px);
        }

        .link-cool { background: rgba(0, 243, 255, 0.1); color: var(--accent-cyan); border-color: rgba(0, 243, 255, 0.2); }
        .link-cool:hover { background: rgba(0, 243, 255, 0.2); }
        
        .link-quiz { background: rgba(255, 215, 0, 0.1); color: #ffd700; border-color: rgba(255, 215, 0, 0.2); }
        .link-quiz:hover { background: rgba(255, 215, 0, 0.2); }
        
        .link-list { background: rgba(46, 213, 115, 0.1); color: #2ed573; border-color: rgba(46, 213, 115, 0.2); }
        .link-list:hover { background: rgba(46, 213, 115, 0.2); }

        .link-exam { background: rgba(188, 19, 254, 0.1); color: #e0aaff; border-color: rgba(188, 19, 254, 0.2); }
        .link-exam:hover { background: rgba(188, 19, 254, 0.2); }

        .link-long { background: rgba(255, 170, 0, 0.1); color: #ffaa00; border-color: rgba(255, 170, 0, 0.2); }
        .link-long:hover { background: rgba(255, 170, 0, 0.2); }

        .fav-remove-btn {
            background: rgba(255, 0, 85, 0.1);
            color: var(--accent-pink);
            border: 1px solid rgba(255, 0, 85, 0.2);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .fav-remove-btn:hover {
            background: rgba(255, 0, 85, 0.3);
        }

        /* お気に入り：過去最高ランク・スコアバッジ */
        .fav-best {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 60px;
            margin-right: 0.5rem;
        }

        .fav-rank-badge {
            font-size: 1.1rem;
            font-weight: 900;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2px;
        }

        .rank-S {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #000;
            box-shadow: 0 0 8px rgba(255, 200, 0, 0.5);
        }

        .rank-A {
            background: linear-gradient(135deg, #c0c0c0, #a0a0a0);
            color: #000;
        }

        .rank-B {
            background: rgba(0, 243, 255, 0.25);
            color: var(--accent-cyan);
            border: 1px solid var(--accent-cyan);
        }

        .rank-C {
            background: rgba(255, 255, 255, 0.1);
            color: #aaa;
            border: 1px solid #555;
        }

        .rank-D {
            background: rgba(255, 0, 85, 0.15);
            color: var(--accent-pink);
            border: 1px solid var(--accent-pink);
        }

        .rank-none {
            background: rgba(255, 255, 255, 0.05);
            color: #666;
            border: 1px solid #444;
            font-size: 0.7rem;
        }

        .fav-best-score {
            font-size: 0.65rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        /* 履歴 */
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            margin-bottom: 3rem;
        }

        .history-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 1rem;
            border-radius: var(--radius-sm);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-score {
            font-weight: bold;
            color: var(--accent-green);
        }

        .history-link {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 243, 255, 0.1);
            color: var(--accent-cyan);
            text-decoration: none;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .history-link:hover {
            background: rgba(0, 243, 255, 0.25);
        }

        /* リクエストフォーム */
        .request-section {
            background: linear-gradient(135deg, rgba(188, 19, 254, 0.1), rgba(0, 243, 255, 0.05));
            border: 1px solid rgba(188, 19, 254, 0.2);
            border-radius: var(--radius-lg);
            padding: 2rem;
            margin-bottom: 3rem;
        }

        .request-section h3 {
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .request-section p {
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .request-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .request-form input,
        .request-form textarea {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-sm);
            padding: 12px;
            color: #fff;
            font-family: var(--font-main);
            font-size: 0.9rem;
        }

        .request-form textarea {
            min-height: 100px;
            resize: vertical;
        }

        .request-form input:focus,
        .request-form textarea:focus {
            outline: none;
            border-color: var(--accent-purple);
        }

        .request-submit-btn {
            background: var(--gradient-primary);
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
            align-self: flex-start;
        }

        .request-submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(188, 19, 254, 0.4);
        }

        .empty-msg {
            color: var(--text-muted);
            text-align: center;
            padding: 1rem;
        }
    </style>
</head>

<body>
    <a href="index.html" class="nav-back">← Topに戻る</a>
    <nav style="padding: 1.5rem;">
        <div class="container" style="display: flex; justify-content: flex-end; align-items: center;">
            <a href="exam.html" class="btn btn-sm">検定へ →</a>
        </div>

    <main class="container">
        <h1 style="margin-bottom: 2rem;">マイページ</h1>

        <!-- Profile Header -->
        <div class="profile-header">
            <div class="avatar-circle">👤</div>
            <div class="profile-info">
                <h2 id="user-name-display">Player <button class="edit-btn" onclick="editName()">✏️</button></h2>
                <p id="player-level" style="color: var(--accent-cyan);">ビギナー</p>
            </div>
        </div>

        <!-- ストリーク -->
        <h3 class="section-title">🔥 連続記録</h3>
        <div class="streak-row" id="streak-row">
            <!-- JSで生成 -->
        </div>

        <!-- Stats -->
        <div class="stats-row">
            <div class="stat-card">
                <span class="stat-label">累計スコア</span>
                <span class="stat-value" id="stat-total-score">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">受験回数</span>
                <span class="stat-value" id="stat-exams">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">獲得バッジ</span>
                <span class="stat-value" id="stat-badges">0/6</span>
            </div>
        </div>

        <!-- Badges -->
        <h3 class="section-title">獲得バッジ</h3>
        <div class="badge-grid" id="badge-grid">
            <!-- JS will populate -->
        </div>

        <!-- お気に入り -->
        <h3 class="section-title">❤️ お気に入り</h3>
        <div class="favorites-list" id="favorites-list">
            <p class="empty-msg">お気に入りはまだありません。<br>検定や暗記リストで ❤️ を押して追加しよう！</p>
        </div>

        <!-- History -->
        <h3 class="section-title">📜 プレイ履歴</h3>
        <div class="history-list" id="history-list">
            <p class="empty-msg">まだ履歴がありません。<br>検定に挑戦してスコアを記録しよう！</p>
        </div>

        <!-- リクエストフォーム -->
        <div class="request-section">
            <h3>📩 暗記リクエスト</h3>
            <p>「これも暗記検定に入れてほしい！」というものがあれば、ぜひ教えてください！<br>
                リクエストは専用のGoogleフォームから受け付けています。
            </p>
            <div class="request-actions">
                <a href="https://docs.google.com/forms/d/e/1FAIpQLSesS7TIUjmuclvi_psgG0baniDDmzlrdzhAYZGEMnfhSzjQcg/viewform?usp=publish-editor"
                    target="_blank" class="request-submit-btn" style="text-decoration: none; display: inline-block;">📨
                    フォームを開く</a>
            </div>
        </div>

    </main>

    <script src="scripts/user_data.js"></script>
    <script>
        // スプレッドシートのCSVをロードしてカタログとして保持
        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/1IN-PC0r_y6WHSQs1-Xklakj72LYm43q6xUspQ0KueXE/gviz/tq?tqx=out:csv&sheet=精總化';
        window.ITEM_CATALOG = null;

        async function loadItemCatalog() {
            if (window.ITEM_CATALOG) return window.ITEM_CATALOG;
            try {
                const res = await fetch(SHEET_CSV_URL);
                if (!res.ok) throw new Error();
                const text = await res.text();
                // 簡易CSVパーサ
                const rows = [];
                let row = [], cell = '', inQ = false;
                const clean = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
                for (let i = 0; i < clean.length; i++) {
                    const ch = clean[i];
                    if (ch === '"') inQ = !inQ;
                    else if (ch === ',' && !inQ) { row.push(cell); cell = ''; }
                    else if (ch === '\n' && !inQ) { row.push(cell); rows.push(row); row = []; cell = ''; }
                    else cell += ch;
                }
                row.push(cell); rows.push(row);
                const catalog = {};
                rows.slice(1).forEach(r => {
                    if (r.length >= 4 && r[1]) {
                        catalog[r[1].trim()] = {
                            content: r[3] || '',
                            type: r.length > 4 ? r[4].trim() : ''
                        };
                    }
                });
                window.ITEM_CATALOG = catalog;
                return catalog;
            } catch {
                window.ITEM_CATALOG = {};
                return {};
            }
        }

        function getAvailableModes(title, catalog) {
            const info = catalog ? catalog[title] : null;
            if (!info) {
                // カタログがない場合は全部表示
                return { cool: true, quiz: true, list: true, exam: true, long: true };
            }
            const content = info.content || '';
            const type = info.type || '';

            const items = content.split(/,|、|\n/).map(s => s.trim()).filter(s => s);
            // クイズ: q(あ) 形式が4件以上
            const quizPairs = items.filter(s => /^.+[\(\uff08].+[\)\uff09]$/.test(s));
            const hasQuiz = quizPairs.length >= 4;
            // リスト: 項目が2件以上
            const hasList = items.length >= 2;
            const hasLong = type === '1';

            return { cool: true, quiz: hasQuiz, list: hasList, exam: true, long: hasLong };
        }

        document.addEventListener('DOMContentLoaded', async () => {
            renderMyPage();
            // カタログを非同期でロードし、完了後にお気に入り部分だけ再描画
            loadItemCatalog().then(() => {
                const data = UserData.get();
                if (data.favorites && data.favorites.length > 0) renderFavorites(data);
            });
        });

        function renderMyPage() {
            const data = UserData.get();

            // プロフィール
            document.getElementById('user-name-display').innerHTML = `${data.userName} <button class="edit-btn" onclick="editName()">✏️</button>`;

            // レベル計算
            let level = 'ビギナー';
            if (data.totalScore > 100) level = 'ノービス';
            if (data.totalScore > 500) level = 'アドバンス';
            if (data.totalScore > 1000) level = 'エキスパート';
            if (data.totalScore > 5000) level = 'マスター';
            document.getElementById('player-level').textContent = level;

            // 統計
            document.getElementById('stat-total-score').textContent = data.totalScore;
            document.getElementById('stat-exams').textContent = data.examsTaken;

            // ストリーク
            renderStreaks();

            // バッジ
            renderBadges(data);

            // お気に入り
            renderFavorites(data);

            // 履歴
            renderHistory(data);
        }

        function renderStreaks() {
            const streaks = UserData.getStreaks();
            const streakRow = document.getElementById('streak-row');
            streakRow.innerHTML = '';

            const items = [
                { icon: '🌟', value: streaks.totalDays, label: '累計学習日数', customMsg: '日々積み重ねてえらい！' },
                { icon: '👏', value: streaks.restarts, label: 'カムバック回数', customMsg: '戻ってきて最高！' },
                { icon: '🔥', value: streaks.days, best: streaks.bestDays, label: '日連続' },
                { icon: '📅', value: streaks.weeks, best: streaks.bestWeeks, label: '週連続' },
                { icon: '🗓️', value: streaks.months, best: streaks.bestMonths, label: 'ヶ月連続' },
                { icon: '🏆', value: streaks.years, best: streaks.bestYears, label: '年連続' }
            ];

            items.forEach(item => {
                const isBest = item.best !== undefined && item.value > 0 && item.value >= item.best;
                const card = document.createElement('div');
                card.className = `streak-card${isBest ? ' is-best' : ''}`;
                
                let subText = '';
                if (item.customMsg) {
                    subText = `<span class="streak-best" style="color: var(--accent-pink); font-weight: bold;">${item.customMsg}</span>`;
                } else {
                    subText = `<span class="streak-best">過去最高: ${item.best}</span>`;
                }

                card.innerHTML = `
                    <span class="streak-icon">${item.icon}${isBest ? ' 🏅' : ''}</span>
                    <span class="streak-value">${item.value}</span>
                    <span class="streak-label">${item.label}</span>
                    ${subText}
                `;
                streakRow.appendChild(card);
            });
        }

        function renderBadges(data) {
            const badgeGrid = document.getElementById('badge-grid');
            badgeGrid.innerHTML = '';

            let unlockedCount = 0;
            for (const [id, info] of Object.entries(UserData.BADGES)) {
                const isUnlocked = data.badges.includes(id);
                if (isUnlocked) unlockedCount++;

                const bgDiv = document.createElement('div');
                bgDiv.className = `badge-item ${isUnlocked ? 'unlocked' : ''}`;
                bgDiv.innerHTML = `
                    <span class="badge-icon">${info.icon}</span>
                    <div class="badge-name">${info.name}</div>
                    ${isUnlocked ? '' : '<div style="font-size:0.7rem; color:#888;">???</div>'}
                `;
                if (isUnlocked) bgDiv.title = info.desc;
                badgeGrid.appendChild(bgDiv);
            }
            document.getElementById('stat-badges').textContent = `${unlockedCount}/${Object.keys(UserData.BADGES).length}`;
        }

        function renderFavorites(data) {
            const favList = document.getElementById('favorites-list');

            if (!data.favorites || data.favorites.length === 0) {
                favList.innerHTML = '<p class="empty-msg">お気に入りはまだありません。<br>検定や暗記リストで ❤️ を押して追加しよう！</p>';
                return;
            }

            favList.innerHTML = '';
            data.favorites.forEach(fav => {
                // この検定テーマの過去最高を取得
                const best = UserData.getBestResult(fav.title);

                // ランクバッジHTML生成
                let bestHtml;
                if (best) {
                    const rankClass = `rank-${best.rank || 'none'}`;
                    bestHtml = `
                        <div class="fav-best">
                            <span class="fav-rank-badge ${rankClass}">${best.rank || '?'}</span>
                            <span class="fav-best-score">最高 ${best.score}点</span>
                            <span class="fav-best-score">${best.count}回挑戦</span>
                        </div>`;
                } else {
                    bestHtml = `
                        <div class="fav-best">
                            <span class="fav-rank-badge rank-none">未</span>
                            <span class="fav-best-score">まず挑戦！</span>
                        </div>`;
                }

                // 利用可能なゲームモードを判定
                const modes = getAvailableModes(fav.title, window.ITEM_CATALOG);
                
                // 各リンクのHTMLを条件付きで生成
                const coolLink = modes.cool ? `<a href="cool.html?title=${encodeURIComponent(fav.title)}" class="link-cool"><span style="font-size:1.2rem;">📖</span>解説</a>` : '';
                const quizLink = modes.quiz ? `<a href="quiz_game.html?title=${encodeURIComponent(fav.title)}" class="link-quiz"><span style="font-size:1.2rem;">🎯</span>クイズ</a>` : '';
                const listLink = modes.list ? `<a href="list_game.html?title=${encodeURIComponent(fav.title)}" class="link-list"><span style="font-size:1.2rem;">📝</span>リスト</a>` : '';
                const examLink = modes.exam ? `<a href="exam.html?title=${encodeURIComponent(fav.title)}" class="link-exam"><span style="font-size:1.2rem;">🏆</span>検定</a>` : '';
                const longLink = modes.long ? `<a href="long_game.html?title=${encodeURIComponent(fav.title)}" class="link-long"><span style="font-size:1.2rem;">🧠</span>長文</a>` : '';
                
                // 表示するリンク数に応じてグリッド列数を調整
                const linkCount = [modes.cool, modes.quiz, modes.list, modes.exam, modes.long].filter(Boolean).length;
                const gridCols = linkCount > 0 ? `repeat(${linkCount}, 1fr)` : '1fr';

                const item = document.createElement('div');
                item.className = 'fav-item';
                item.innerHTML = `
                    <div class="fav-item-info">
                        <div style="display:flex; align-items:center; gap:1rem;">
                            ${bestHtml}
                            <div>
                                <div style="font-weight:bold; font-size:1.1rem; margin-bottom:0.2rem;">${fav.title}</div>
                                <div style="font-size:0.8rem; color:var(--text-muted);">${fav.category || ''}</div>
                            </div>
                        </div>
                        <button class="fav-remove-btn" onclick="removeFav('${fav.title.replace(/'/g, "\\'")}')" title="お気に入りから削除">✕</button>
                    </div>
                    ${linkCount > 0 ? `<div class="fav-actions" style="grid-template-columns:${gridCols};">${coolLink}${quizLink}${listLink}${examLink}${longLink}</div>` : ''}
                `;
                favList.appendChild(item);
            });
        }

        function renderHistory(data) {
            const historyList = document.getElementById('history-list');
            if (data.history.length === 0) {
                historyList.innerHTML = '<p class="empty-msg">まだ履歴がありません。<br>検定に挑戦してスコアを記録しよう！</p>';
                return;
            }

            historyList.innerHTML = '';
            data.history.forEach(h => {
                const date = new Date(h.date).toLocaleDateString();
                const typeLabel = h.type === 'quiz' ? '［クイズ］' : (h.type === 'list' ? '［リスト］' : '［検定］');
                const typeColor = h.type === 'quiz' ? 'var(--accent-cyan)' : (h.type === 'list' ? 'var(--accent-purple)' : 'var(--accent-green)');
                const retryUrl = h.type === 'quiz' ? `quiz_game.html?title=${encodeURIComponent(h.title)}` : (h.type === 'list' ? `list_game.html?title=${encodeURIComponent(h.title)}` : `exam.html?title=${encodeURIComponent(h.title)}`);

                const isFav = data.favorites && data.favorites.some(f => f.title === h.title);
                const favIcon = isFav ? '❤️' : '🤍';
                const favAction = isFav ? `removeFav('${h.title.replace(/'/g, "\\'")}')` : `addFavFromHistory('${h.title.replace(/'/g, "\\'")}')`;

                const item = document.createElement('div');
                item.className = 'history-item';
                item.innerHTML = `
                    <div style="flex: 1; text-align: left;">
                        <div style="font-weight:bold; display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
                            <span style="font-size: 0.6rem; color: ${typeColor}; border: 1px solid ${typeColor}; padding: 1px 4px; border-radius: 4px; white-space: nowrap;">${typeLabel}</span>
                            ${h.title}
                            <button onclick="${favAction}" style="background:none; border:none; cursor:pointer; font-size:1.2rem; padding:0; line-height:1; outline:none;" title="お気に入り">${favIcon}</button>
                        </div>
                        <div style="font-size:0.8rem; color:var(--text-muted);">${date} - ランク ${h.rank} - ${h.score} 点</div>
                    </div>
                    <a href="${retryUrl}" class="history-link">🔄 もう一度</a>
                `;
                historyList.appendChild(item);
            });
        }

        function editName() {
            const newName = prompt("新しい名前を入力してください", UserData.get().userName);
            if (newName && newName.trim()) {
                UserData.updateName(newName.trim());
                renderMyPage();
            }
        }

        function removeFav(title) {
            UserData.removeFavorite(title);
            renderMyPage();
        }

        function addFavFromHistory(title) {
            UserData.addFavorite({ title: title, category: '履歴から追加' });
            renderMyPage();
        }
    </script>
</body>

</html>

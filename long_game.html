<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>長い名前記憶ゲーム | Memorization is a Game</title>
    <meta name="description" content="円周率やピカソの本名など、長い文字列をチャンクで楽しく覚えるゲーム。">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+JP:wght@400;700&family=Outfit:wght@700;900&display=swap"
        rel="stylesheet">

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel for in-browser JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- User Data -->
    <script src="scripts/user_data.js"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/animations.css">

    <style>
        body {
            margin: 0;
            background: #111;
            color: #fff;
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            overflow-x: hidden;
        }

        #root {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* 背景オーブ装飾 */
        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.2;
            pointer-events: none;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: #f0932b;
            top: -100px;
            left: -100px;
            animation: float 8s infinite alternate;
        }

        .orb-2 {
            width: 300px;
            height: 300px;
            background: #9b51e0;
            bottom: 10%;
            right: -50px;
            animation: float 6s infinite alternate-reverse;
        }

        @keyframes float {
            0%   { transform: translateY(0px) scale(1); }
            100% { transform: translateY(30px) scale(1.1); }
        }

        /* カードコンテナ */
        .app-container {
            z-index: 10;
            width: 100%;
            max-width: 820px;
            padding: 2rem;
            box-sizing: border-box;
        }

        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 2.5rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* ボタン共通 */
        .btn {
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #f0932b, #9b51e0);
            color: #fff;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(240,147,43,0.4);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.2);
        }

        /* 入力フィールド */
        .input-field {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 1rem;
            border-radius: 12px;
            font-size: 1.1rem;
            width: 100%;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        .input-field:focus {
            outline: none;
            border-color: #f0932b;
        }

        /* ---- 文字列表示エリア ---- */
        .long-name-display {
            font-family: 'Outfit', 'Noto Sans JP', monospace;
            font-size: clamp(1rem, 3vw, 1.5rem);
            letter-spacing: 0.05em;
            line-height: 1.8;
            word-break: break-all;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            padding: 1.4rem;
            margin: 1rem 0;
            user-select: none;
            position: relative;
            -webkit-user-select: none;
        }

        /* セットアップ画面 - ドラッグ選択用ハイライト */
        .char-span {
            display: inline;
            cursor: default;
            border-radius: 3px;
            transition: background 0.1s;
        }

        .char-context  { color: #666; }
        .char-review   { color: #7ff; background: rgba(0,220,220,0.18); border-radius:3px; }
        .char-new      { color: #c9a7ff; background: rgba(155,81,224,0.22); border-radius:3px; }
        .char-selected { background: rgba(240,147,43,0.32); color: #ffd; }
        .char-correct  { background: rgba(46,213,115,0.3); color: #2ed573; }
        .char-wrong    { background: rgba(255,71,87,0.3); color: #ff4757; }
        .char-pending  { color: #777; }

        /* SVGタイマーリング */
        .timer-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 2rem 0;
        }

        .timer-svg {
            transform: rotate(-90deg);
            filter: drop-shadow(0 0 12px rgba(240,147,43,0.5));
        }

        .timer-text {
            font-size: 3rem;
            font-weight: 900;
            font-family: 'Outfit', sans-serif;
        }

        /* テスト入力欄 */
        .test-input {
            font-family: 'Outfit', 'Noto Sans JP', monospace;
            font-size: 1.3rem;
            letter-spacing: 0.1em;
            padding: 1rem 1.2rem;
            width: 100%;
            box-sizing: border-box;
            background: rgba(0,0,0,0.5);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            color: white;
            transition: border-color 0.3s;
        }

        .test-input:focus {
            outline: none;
            border-color: #f0932b;
        }

        /* 凡例 */
        .legend {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            font-size: 0.85rem;
            color: #aaa;
            margin-top: 0.6rem;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        /* ヒント表示（選択中の情報） */
        .selection-hint {
            background: rgba(240,147,43,0.1);
            border: 1px solid rgba(240,147,43,0.3);
            border-radius: 12px;
            padding: 0.8rem 1.2rem;
            font-size: 0.9rem;
            color: #ffa;
            margin-top: 0.6rem;
            min-height: 2.5rem;
        }

        /* 成功画面スコア */
        .result-score {
            font-size: 4rem;
            font-weight: 900;
            text-align: center;
            margin: 1.5rem 0;
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #f0932b, #9b51e0);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 累計スコア表示 */
        .total-score-box {
            background: rgba(240,147,43,0.1);
            border: 1px solid rgba(240,147,43,0.3);
            border-radius: 16px;
            padding: 1rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        h1, h2, h3 { text-align: center; }

        @media (max-width: 600px) {
            .app-container { padding: 1rem; }
            .card { padding: 1.5rem; }
            .long-name-display { font-size: 1rem; }
        }
    </style>
</head>

<body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // ================================================================
        // 覚えられる「長い名前」のデータ一覧
        // ================================================================
        const LONG_ITEMS = [
            {
                id: 'pi',
                title: '円周率（π）',
                subtitle: '3.14159265358979...',
                icon: '🔵',
                content: '31415926535897932384626433832795028841971693993751058209749445923078164062862089986280348253421170679'
            },
            {
                id: 'napier',
                title: 'ネイピア数（e）',
                subtitle: '2.71828182845...',
                icon: '📐',
                content: '27182818284590452353602874713526624977572470936999595749669676277240766303535475945713821785251664274'
            },
            {
                id: 'picasso',
                title: 'ピカソの本名',
                subtitle: 'Pablo Diego José...',
                icon: '🎨',
                content: 'PabloDiegoJoséFranciscodePatricioJuanNepomucenoMaríaRemeGiosDamasoCrispinandelaSantísimaTrinidat'
            },
            {
                id: 'tardigrada',
                title: '学名：クマムシ',
                subtitle: 'Ramazzottius varieornatus',
                icon: '🐻',
                content: 'RamazzottiusvarieornatusIntrachidontaConchostraca'
            },
            {
                id: 'root2',
                title: '√2（ルート2）',
                subtitle: '1.41421356237...',
                icon: '📏',
                content: '14142135623730950488016887242096980785696718753769480731766797379907324784621070388503875343276415727'
            },
            {
                id: 'fib',
                title: 'フィボナッチ数列',
                subtitle: '1,1,2,3,5,8,13,21...',
                icon: '🌀',
                content: '1123581321345589144233377610987159725844181676510946177112865746368750251213931964183178115142298320'
            },
            {
                id: 'bangkok',
                title: 'バンコクの正式名称',
                subtitle: 'タイの首都の長い地名',
                icon: '🇹🇭',
                content: 'KrungThepMahaNakhonAmonRattanakosinMahintharaAyuthayaMahaDilokPhopNoppharat RatchathaniBuilomUdomRatchaniwetMahaSathanAmonPhimanAwatansathitSakkathattiyaWitsanukamPrasit'
            },
            {
                id: 'planck',
                title: 'プランク定数',
                subtitle: '6.62607015 × 10⁻³⁴',
                icon: '⚛️',
                content: '662607015000000000000000000000000001054571817000000000000000000000000000'
            }
        ];

        // ================================================================
        // フェーズ定数
        // ================================================================
        const PHASE = {
            SETUP: 'setup',
            STUDY: 'study',
            TIMER: 'timer',
            TEST:  'test',
            SUCCESS: 'success'
        };

        const TIMER_SEC = 30;

        // ================================================================
        // メインAppコンポーネント
        // ================================================================
        const App = () => {
            // ----- セットアップ状態 -----
            const [selectedItem, setSelectedItem] = useState(LONG_ITEMS[0]);
            const [selStart, setSelStart]   = useState(0);   // 選択開始インデックス
            const [selEnd, setSelEnd]       = useState(9);   // 選択終了インデックス（含む）
            const [inputStart, setInputStart] = useState('0');
            const [inputEnd, setInputEnd]     = useState('9');

            // ----- ゲーム進行状態 -----
            const [phase, setPhase]     = useState(PHASE.SETUP);
            const [reviewLen, setReviewLen] = useState(0); // 今回の"復習"部分の長さ
            const [timeLeft, setTimeLeft]   = useState(TIMER_SEC);
            const [userInput, setUserInput] = useState('');
            const [judgment, setJudgment]   = useState(null); // null | 'perfect' | 'amazing' | 'clear' | 'partial' | 'wrong'
            const [judgeMsg, setJudgeMsg]   = useState('');
            const [partialFill, setPartialFill] = useState(''); // 途中まで正解したときに入れる文字列

            // ----- ドラッグ選択 -----
            const isDragging  = useRef(false);
            const dragStart   = useRef(null);
            const displayRef  = useRef(null);

            const content = selectedItem.content;

            // ================================================================
            // セットアップ：ドラッグ選択 / タッチ選択
            // ================================================================
            const applyDragAt = (charIndex) => {
                if (charIndex === null) return;
                const s = Math.min(dragStart.current, charIndex);
                const e = Math.max(dragStart.current, charIndex);
                setSelStart(s);
                setSelEnd(e);
                setInputStart(String(s));
                setInputEnd(String(e));
            };

            const getCharIndexFromPoint = (clientX, clientY) => {
                const el = document.elementFromPoint(clientX, clientY);
                if (el && el.dataset.ci !== undefined) {
                    return parseInt(el.dataset.ci, 10);
                }
                return null;
            };

            // マウスイベント
            const onMouseDown = (e, ci) => {
                isDragging.current = true;
                dragStart.current  = ci;
                setSelStart(ci); setSelEnd(ci);
                setInputStart(String(ci)); setInputEnd(String(ci));
                e.preventDefault();
            };

            const onMouseMove = (e) => {
                if (!isDragging.current) return;
                const idx = getCharIndexFromPoint(e.clientX, e.clientY);
                applyDragAt(idx);
            };

            const onMouseUp = () => { isDragging.current = false; };

            // タッチイベント（スマホ対応）
            const onTouchStart = (e, ci) => {
                isDragging.current = true;
                dragStart.current  = ci;
                setSelStart(ci); setSelEnd(ci);
                setInputStart(String(ci)); setInputEnd(String(ci));
            };

            const onTouchMove = (e) => {
                if (!isDragging.current) return;
                const touch = e.touches[0];
                const idx = getCharIndexFromPoint(touch.clientX, touch.clientY);
                applyDragAt(idx);
                e.preventDefault(); // スクロール防止
            };

            const onTouchEnd = () => { isDragging.current = false; };

            useEffect(() => {
                window.addEventListener('mouseup', onMouseUp);
                return () => window.removeEventListener('mouseup', onMouseUp);
            }, []);

            // 数字入力から選択範囲を更新
            const handleStartInput = (v) => {
                setInputStart(v);
                const n = parseInt(v, 10);
                if (!isNaN(n) && n >= 0 && n < content.length) {
                    setSelStart(n);
                    if (n > selEnd) { setSelEnd(n); setInputEnd(String(n)); }
                }
            };

            const handleEndInput = (v) => {
                setInputEnd(v);
                const n = parseInt(v, 10);
                if (!isNaN(n) && n >= 0 && n < content.length) {
                    setSelEnd(n);
                    if (n < selStart) { setSelStart(n); setInputStart(String(n)); }
                }
            };

            // 選択中のヒント情報
            const selectedText = content.slice(selStart, selEnd + 1);
            const selLen = selectedText.length;

            // ================================================================
            // スタート！ （セットアップ → STUDY）
            // ================================================================
            const handleStart = (withReview = false) => {
                // withReview = true の場合は前半をreviewとして引き継ぐ
                // （「次の範囲へ」から来たとき）
                setUserInput('');
                setJudgment(null);
                setJudgeMsg('');
                setPartialFill('');
                setPhase(PHASE.STUDY);
            };

            // ================================================================
            // STUDY → TIMER
            // ================================================================
            const handleGotIt = () => {
                setTimeLeft(TIMER_SEC);
                setPhase(PHASE.TIMER);
            };

            // タイマーカウントダウン
            useEffect(() => {
                if (phase !== PHASE.TIMER) return;
                if (timeLeft <= 0) {
                    setPhase(PHASE.TEST);
                    return;
                }
                const t = setTimeout(() => setTimeLeft(p => p - 1), 1000);
                return () => clearTimeout(t);
            }, [phase, timeLeft]);

            // ================================================================
            // TEST → 判定
            // ================================================================
            const handleJudge = () => {
                const ans   = selectedText;           // 正解
                const input = userInput;

                if (input === ans) {
                    // ぴったり正解
                    setJudgment('perfect');
                    setJudgeMsg('🎉 PERFECT!');
                } else if (input.length > ans.length) {
                    // 多めに入力
                    const extended = content.slice(selStart, selStart + input.length);
                    if (input === extended) {
                        // 先の部分も正しい
                        setJudgment('amazing');
                        setJudgeMsg('🌟 AMAZING!! 先まで合ってる！天才かも？');
                    } else if (input.slice(0, ans.length) === ans) {
                        // 今回の範囲はOK、先は違う
                        setJudgment('clear');
                        setJudgeMsg('✅ CLEAR! 今回の範囲はバッチリ！先の桁は次で覚えよう');
                    } else {
                        // 途中から違う
                        _handlePartial(input, ans);
                        return;
                    }
                } else if (input === ans.slice(0, input.length) && input.length > 0) {
                    // 途中まで正解
                    _handlePartial(input, ans);
                    return;
                } else {
                    // 最初から不正解
                    setJudgment('wrong');
                    setJudgeMsg('❌ 最初から違います…もう一度見てみよう');
                }
            };

            const _handlePartial = (input, ans) => {
                // 合っているところまでの長さを計算
                let matchLen = 0;
                for (let i = 0; i < Math.min(input.length, ans.length); i++) {
                    if (input[i] === ans[i]) matchLen = i + 1;
                    else break;
                }
                if (matchLen === 0) {
                    setJudgment('wrong');
                    setJudgeMsg('❌ 最初から違います…もう一度見てみよう');
                } else {
                    setJudgment('partial');
                    setJudgeMsg(`😅 ${matchLen}文字まで正解！正解部分を自動入力しました`);
                    setPartialFill(ans.slice(0, matchLen));
                    setUserInput(ans.slice(0, matchLen));
                }
            };

            // 成功判定かどうか
            const isSuccess = ['perfect','amazing','clear'].includes(judgment);

            // 成功時のスコアを計算（正解した文字数）
            const calcScore = () => {
                if (judgment === 'perfect') return selLen;
                if (judgment === 'amazing') return userInput.length; // 先まで正解した文字数
                if (judgment === 'clear')   return selLen;
                return 0;
            };

            // 成功画面へ進む
            const handleSuccess = () => {
                const score = calcScore();
                UserData.addResult({
                    title: `長い名前: ${selectedItem.title}`,
                    score: score,
                    max: selLen,
                    rank: judgment === 'perfect' ? 'S' : (judgment === 'amazing' ? 'S' : 'A'),
                    type: 'long'
                });
                setPhase(PHASE.SUCCESS);
            };

            // ================================================================
            // 次の範囲へ（reviewLen を自動設定）
            // ================================================================
            const handleNextRange = () => {
                const curLen   = selLen;
                const newReview = Math.ceil(curLen / 2); // 今の後半 ceil(len/2) を復習へ
                const newNew    = Math.floor(curLen / 2); // 新しく覚える = floor(len/2)

                // 新しい選択範囲の start/end
                const newSelStart = selEnd + 1 - newReview + curLen - (curLen - newReview); // = selEnd + 1 - newReview + newReview - 0
                // サンプル計算：
                // selEnd+1 が次の開始位置
                // 次の範囲 = (現在の後半 newReview) + (新しい newNew) = ceil(cur/2) + floor(cur/2) = curLen
                // 開始は selEnd+1-newReview（現在の後半の先頭）
                const nextStart = selEnd + 1 - newReview;
                const nextEnd   = Math.min(nextStart + curLen - 1, content.length - 1);

                setReviewLen(newReview);
                setSelStart(nextStart);
                setSelEnd(nextEnd);
                setInputStart(String(nextStart));
                setInputEnd(String(nextEnd));

                setUserInput('');
                setJudgment(null);
                setJudgeMsg('');
                setPartialFill('');
                setPhase(PHASE.STUDY);
            };

            // ================================================================
            // 同じ範囲でもう一度
            // ================================================================
            const handleRetry = () => {
                setReviewLen(0);
                setUserInput('');
                setJudgment(null);
                setJudgeMsg('');
                setPartialFill('');
                setPhase(PHASE.STUDY);
            };

            // ================================================================
            // レンダー：フェーズ切替
            // ================================================================
            if (phase === PHASE.SETUP)   return renderSetup();
            if (phase === PHASE.STUDY)   return renderStudy();
            if (phase === PHASE.TIMER)   return renderTimer();
            if (phase === PHASE.TEST)    return renderTest();
            if (phase === PHASE.SUCCESS) return renderSuccess();

            // ================================================================
            // ① セットアップ画面
            // ================================================================
            function renderSetup() {
                return (
                    <div className="app-container">
                        <div className="card animate-fade-in">
                            <h2 style={{ color: '#f0932b', marginBottom: '0.3rem' }}>🧠 長い名前記憶ゲーム</h2>
                            <p style={{ textAlign: 'center', color: '#888', marginTop: 0, marginBottom: '1.5rem' }}>
                                覚える範囲を選んでスタート！
                            </p>

                            {/* テーマ選択 */}
                            <p style={{ color: '#aaa', marginBottom: '0.5rem' }}>何を覚える？</p>
                            <select
                                className="input-field"
                                style={{ cursor: 'pointer', marginBottom: '1.5rem' }}
                                value={selectedItem.id}
                                onChange={(e) => {
                                    const item = LONG_ITEMS.find(i => i.id === e.target.value);
                                    setSelectedItem(item);
                                    setSelStart(0); setSelEnd(Math.min(9, item.content.length - 1));
                                    setInputStart('0'); setInputEnd(String(Math.min(9, item.content.length - 1)));
                                    setReviewLen(0);
                                }}
                            >
                                {LONG_ITEMS.map(item => (
                                    <option key={item.id} value={item.id}>{item.icon} {item.title} — {item.subtitle}</option>
                                ))}
                            </select>

                            {/* 文字列表示エリア（ドラッグ選択） */}
                            <p style={{ color: '#aaa', marginBottom: '0.3rem' }}>
                                覚えたい範囲をドラッグ or スワイプで選択 👇
                            </p>
                            <div
                                className="long-name-display"
                                ref={displayRef}
                                onMouseMove={onMouseMove}
                                onTouchMove={onTouchMove}
                                onTouchEnd={onTouchEnd}
                            >
                                {content.split('').map((ch, i) => (
                                    <span
                                        key={i}
                                        data-ci={i}
                                        className={`char-span ${i >= selStart && i <= selEnd ? 'char-selected' : 'char-context'}`}
                                        onMouseDown={(e) => onMouseDown(e, i)}
                                        onTouchStart={(e) => onTouchStart(e, i)}
                                    >{ch}</span>
                                ))}
                            </div>

                            {/* 選択ヒント */}
                            <div className="selection-hint">
                                {selLen > 0
                                    ? <>📍 <b>{selStart + 1}〜{selEnd + 1}文字目</b>（<b>{selLen}文字</b>）：
                                        <span style={{ fontFamily: 'monospace', marginLeft: '0.4em', wordBreak: 'break-all' }}>
                                            {selectedText}
                                        </span>
                                    </>
                                    : '← 文字をドラッグして選択してください'
                                }
                            </div>

                            {/* 数字入力で範囲指定 */}
                            <div style={{ display: 'flex', gap: '0.7rem', marginTop: '1rem', alignItems: 'center', flexWrap: 'wrap' }}>
                                <span style={{ color: '#aaa', fontSize: '0.9rem' }}>または桁で直接指定：</span>
                                <input
                                    type="number"
                                    min="0"
                                    max={content.length - 1}
                                    value={inputStart}
                                    onChange={e => handleStartInput(e.target.value)}
                                    style={{ width: '70px', padding: '0.4rem 0.5rem', background: 'rgba(0,0,0,0.5)', border: '1px solid rgba(255,255,255,0.2)', color: '#fff', borderRadius: '8px', fontSize: '1rem' }}
                                />
                                <span style={{ color: '#aaa' }}>〜</span>
                                <input
                                    type="number"
                                    min="0"
                                    max={content.length - 1}
                                    value={inputEnd}
                                    onChange={e => handleEndInput(e.target.value)}
                                    style={{ width: '70px', padding: '0.4rem 0.5rem', background: 'rgba(0,0,0,0.5)', border: '1px solid rgba(255,255,255,0.2)', color: '#fff', borderRadius: '8px', fontSize: '1rem' }}
                                />
                                <span style={{ color: '#666', fontSize: '0.85rem' }}>（0〜{content.length - 1}）</span>
                            </div>

                            {/* スタートボタン */}
                            <button
                                className="btn btn-primary"
                                style={{ width: '100%', padding: '1rem', fontSize: '1.2rem', marginTop: '2rem' }}
                                onClick={() => handleStart()}
                                disabled={selLen === 0}
                            >
                                スタート 🚀
                            </button>

                            <a href="index.html" style={{ display: 'block', textAlign: 'center', marginTop: '1.5rem', color: '#888', textDecoration: 'none' }}>
                                トップに戻る
                            </a>
                        </div>
                    </div>
                );
            }

            // ================================================================
            // ② STUDY MODE（覚えよう！）
            // ================================================================
            function renderStudy() {
                // reviewLen > 0 の場合：selStart〜selStart+reviewLen-1 が復習（水色）
                // それ以降が新しい範囲（紫）
                const reviewEnd = selStart + reviewLen - 1; // 復習の最終インデックス

                return (
                    <div className="app-container">
                        <div className="card animate-fade-in">
                            <h2 style={{ color: '#0defd2', marginBottom: '0.3rem' }}>📖 STUDY MODE — 覚えよう！</h2>
                            <p style={{ textAlign: 'center', color: '#888', marginTop: 0, marginBottom: '1rem' }}>
                                {selectedItem.icon} {selectedItem.title}
                            </p>

                            {/* 凡例 */}
                            {reviewLen > 0 && (
                                <div className="legend" style={{ justifyContent: 'center', marginBottom: '0.5rem' }}>
                                    <span className="legend-item"><span className="char-review">■</span> 復習</span>
                                    <span className="legend-item"><span className="char-new">■</span> 新しい</span>
                                </div>
                            )}

                            {/* 文字列表示 */}
                            <div className="long-name-display" style={{ userSelect: 'text' }}>
                                {content.split('').map((ch, i) => {
                                    let cls = 'char-span';
                                    if (i < selStart) {
                                        cls += ' char-context'; // 前のコンテキスト（グレー）
                                    } else if (i <= selEnd) {
                                        if (reviewLen > 0 && i <= reviewEnd) {
                                            cls += ' char-review'; // 復習（水色）
                                        } else {
                                            cls += ' char-new'; // 新しい（紫）
                                        }
                                    } else {
                                        cls += ' char-pending'; // 未学習エリア
                                    }
                                    return <span key={i} className={cls}>{ch}</span>;
                                })}
                            </div>

                            {/* ボタン群 */}
                            <div style={{ display: 'flex', flexDirection: 'column', gap: '0.8rem', marginTop: '2rem' }}>
                                <button className="btn btn-primary" style={{ padding: '1rem', fontSize: '1.1rem' }} onClick={handleGotIt}>
                                    覚えた！⏱ タイマーへ
                                </button>
                                <button className="btn btn-secondary" onClick={() => { setPhase(PHASE.SETUP); }}>
                                    ← セットアップに戻る
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            // ================================================================
            // ③ TIMER MODE（30秒カウントダウン）
            // ================================================================
            function renderTimer() {
                const ratio    = timeLeft / TIMER_SEC;
                const r        = 60;
                const circumf  = 2 * Math.PI * r;
                const dashOffset = circumf * (1 - ratio);
                const isDanger = timeLeft <= 10;

                return (
                    <div className="app-container">
                        <div className="card animate-fade-in" style={{ textAlign: 'center', padding: '3rem 2rem' }}>
                            <h2 style={{ color: '#f0932b', marginBottom: '1rem' }}>⏱ TIMER MODE</h2>
                            <p style={{ color: '#aaa', marginBottom: '0' }}>頭の中で復唱してみよう！</p>

                            {/* SVGリングタイマー */}
                            <div className="timer-wrap">
                                <svg width="160" height="160" className="timer-svg">
                                    <circle cx="80" cy="80" r={r} fill="none" stroke="rgba(255,255,255,0.1)" strokeWidth="8"/>
                                    <circle
                                        cx="80" cy="80" r={r} fill="none"
                                        stroke={isDanger ? '#ff4757' : 'url(#timerGrad)'}
                                        strokeWidth="8"
                                        strokeLinecap="round"
                                        strokeDasharray={circumf}
                                        strokeDashoffset={dashOffset}
                                        style={{ transition: 'stroke-dashoffset 1s linear' }}
                                    />
                                    <defs>
                                        <linearGradient id="timerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                                            <stop offset="0%" stopColor="#f0932b"/>
                                            <stop offset="100%" stopColor="#9b51e0"/>
                                        </linearGradient>
                                    </defs>
                                </svg>
                                <div
                                    className="timer-text"
                                    style={{
                                        color: isDanger ? '#ff4757' : '#fff',
                                        marginTop: '-130px',
                                        animation: isDanger ? 'pulse 1s infinite' : 'none'
                                    }}
                                >
                                    {timeLeft}
                                </div>
                            </div>

                            <p style={{ marginTop: '3rem', color: '#aaa' }}>
                                「{content.slice(selStart, selEnd + 1).slice(0, 8)}...」と頭の中で復唱しよう
                            </p>
                        </div>
                    </div>
                );
            }

            // ================================================================
            // ④ TEST MODE（入力して確認）
            // ================================================================
            function renderTest() {
                // 判定結果ごとの文字色
                const getCharTestClass = (i) => {
                    if (i < selStart) return 'char-context';
                    const localIdx = i - selStart;
                    if (!judgment) return 'char-pending';
                    if (judgment === 'perfect' || judgment === 'amazing' || judgment === 'clear') {
                        if (i <= selEnd) return 'char-correct';
                    }
                    if (judgment === 'partial') {
                        if (localIdx < partialFill.length) return 'char-correct';
                        if (i <= selEnd) return 'char-wrong';
                    }
                    if (judgment === 'wrong') {
                        if (i <= selEnd) return 'char-wrong';
                    }
                    return 'char-pending';
                };

                return (
                    <div className="app-container">
                        <div className="card animate-fade-in">
                            <h2 style={{ color: '#9b51e0', marginBottom: '0.3rem' }}>✏️ TEST MODE — 入力して確認</h2>
                            <p style={{ textAlign: 'center', color: '#888', marginTop: 0, marginBottom: '1rem' }}>
                                {selectedItem.icon} {selectedItem.title}
                            </p>

                            {/* コンテキスト + 判定プレビュー */}
                            <div className="long-name-display">
                                {content.split('').map((ch, i) => (
                                    <span key={i} className={`char-span ${getCharTestClass(i)}`}>{ch}</span>
                                ))}
                            </div>

                            {/* テスト入力欄 */}
                            <p style={{ color: '#aaa', fontSize: '0.9rem', marginTop: '1rem', marginBottom: '0.4rem' }}>
                                {selStart + 1}文字目から{selEnd + 1}文字目を入力：
                            </p>
                            <input
                                className="test-input"
                                type="text"
                                autoFocus
                                value={userInput}
                                onChange={e => {
                                    setUserInput(e.target.value);
                                    setJudgment(null);
                                    setJudgeMsg('');
                                }}
                                onKeyDown={e => { if (e.key === 'Enter' && !judgment) handleJudge(); }}
                                placeholder="ここに入力..."
                                disabled={!!judgment}
                            />

                            {/* 判定メッセージ */}
                            {judgment && (
                                <div style={{
                                    textAlign: 'center',
                                    marginTop: '1rem',
                                    fontSize: '1.3rem',
                                    fontWeight: 'bold',
                                    color: isSuccess ? '#2ed573' : (judgment === 'partial' ? '#ffa' : '#ff4757'),
                                    animation: 'pop 0.4s ease'
                                }}>
                                    {judgeMsg}
                                </div>
                            )}

                            {/* ボタン群 */}
                            <div style={{ display: 'flex', flexDirection: 'column', gap: '0.8rem', marginTop: '1.5rem' }}>
                                {!judgment ? (
                                    <>
                                        <button className="btn btn-primary" style={{ padding: '1rem' }} onClick={handleJudge}>
                                            確認する ✅
                                        </button>
                                        <button className="btn btn-secondary" onClick={() => setPhase(PHASE.STUDY)}>
                                            もう一度見る 👀
                                        </button>
                                    </>
                                ) : isSuccess ? (
                                    <button className="btn btn-primary" style={{ padding: '1rem', fontSize: '1.1rem' }} onClick={handleSuccess}>
                                        🎊 結果を見る
                                    </button>
                                ) : (
                                    <>
                                        <button className="btn btn-secondary" onClick={() => setPhase(PHASE.STUDY)}>
                                            もう一度見る 👀
                                        </button>
                                        <button className="btn btn-secondary" onClick={() => {
                                            setJudgment(null); setJudgeMsg(''); setUserInput('');
                                        }}>
                                            再入力する
                                        </button>
                                    </>
                                )}
                            </div>
                        </div>

                        <style>{`
                            @keyframes pop {
                                0%   { transform: scale(0.8); opacity: 0; }
                                60%  { transform: scale(1.1); }
                                100% { transform: scale(1); opacity: 1; }
                            }
                        `}</style>
                    </div>
                );
            }

            // ================================================================
            // ⑤ SUCCESS SCREEN（クリア！）
            // ================================================================
            function renderSuccess() {
                const score = calcScore();
                const totalScore = UserData.get().totalScore;

                // モードによってアイコン・タイトル・メッセージを変える
                const modeInfo = {
                    perfect: { icon: '🎉', title: 'PERFECT!',  msg: 'ぴったり完璧！素晴らしい！' },
                    amazing: { icon: '🌟', title: 'AMAZING!!', msg: '先まで合ってる！天才かも？！' },
                    clear:   { icon: '✅', title: 'CLEAR!',    msg: '今回の範囲はバッチリ！次も頑張ろう！' },
                };
                const info = modeInfo[judgment] || { icon: '🎊', title: 'CLEAR!', msg: 'お疲れさまでした！' };

                return (
                    <div className="app-container">
                        <div className="card animate-fade-in" style={{ textAlign: 'center' }}>
                            <div style={{ fontSize: '4rem', marginBottom: '0.5rem' }}>{info.icon}</div>
                            <h2 style={{
                                fontSize: '2.5rem',
                                background: 'linear-gradient(135deg, #f0932b, #9b51e0)',
                                backgroundClip: 'text',
                                WebkitBackgroundClip: 'text',
                                WebkitTextFillColor: 'transparent',
                                marginBottom: '0.3rem'
                            }}>{info.title}</h2>
                            <p style={{ color: '#aaa', marginBottom: '1rem' }}>{info.msg}</p>

                            {/* スコア表示 */}
                            <div className="result-score">{score} 文字</div>
                            <p style={{ color: '#888', marginTop: '-0.5rem', marginBottom: '1rem' }}>正解した文字数がスコアに加算！</p>

                            {/* 累計スコア */}
                            <div className="total-score-box">
                                <span style={{ color: '#aaa', fontSize: '0.85rem', display: 'block', marginBottom: '0.3rem' }}>累計スコア</span>
                                <span style={{ fontSize: '1.6rem', fontWeight: 'bold', color: '#f0932b' }}>
                                    ✨ {totalScore} <small style={{ fontSize: '0.9rem', marginLeft: '4px' }}>(+{score})</small> ✨
                                </span>
                            </div>

                            {/* ボタン群 */}
                            <div style={{ display: 'flex', flexDirection: 'column', gap: '0.8rem' }}>
                                <button className="btn btn-primary" style={{ padding: '1rem', fontSize: '1.1rem' }} onClick={handleNextRange}>
                                    次の範囲へ →
                                </button>
                                <button className="btn btn-secondary" onClick={handleRetry}>
                                    同じ範囲でもう一度 🔄
                                </button>
                                <button className="btn btn-secondary" onClick={() => { setPhase(PHASE.SETUP); setReviewLen(0); }}>
                                    セットアップに戻る ⚙️
                                </button>
                                <a href="index.html" style={{ display: 'block', textAlign: 'center', marginTop: '0.5rem', color: '#888', textDecoration: 'none' }}>
                                    トップに戻る
                                </a>
                            </div>
                        </div>

        <style>{`
            @keyframes pulse {
                0%   { transform: scale(1); }
                50%  { transform: scale(1.05); }
                100% { transform: scale(1); }
            }
        `}</style>
                    </div>
                );
            }
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>

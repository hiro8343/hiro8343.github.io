<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>暗記したらかっこいい | 楽しい暗記サイト</title>
    <meta name="description" content="円周率100桁、いろはうた、88星座、歴代元号など、暗記したらかっこいいロマンあふれる知識のコレクション。">
    <meta name="keywords" content="暗記, 記憶術, かっこいい, 教養, いろはうた, 円周率100桁, 88星座, 歴代元号, 素数">
    <meta property="og:title" content="暗記したらかっこいい | 楽しい暗記サイト">
    <meta property="og:description" content="円周率100桁、いろはうた、88星座、歴代元号など、暗記したらかっこいいロマンあふれる知識のコレクション。">
    <meta property="og:type" content="article">
    <meta property="og:url" content="https://hiro8343.github.io/cool.html">
    <meta name="twitter:card" content="summary_large_image">
    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+JP:wght@400;700&family=Outfit:wght@700;900&display=swap"
        rel="stylesheet">
    <!-- Styles -->
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/animations.css">
    <style>
        .cool-header {
            text-align: center;
            padding: 4rem 0 2rem;
        }

        .filters {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 3rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 20px;
            border-radius: 50px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-btn.active,
        .filter-btn:hover {
            border-color: var(--accent-purple);
            color: #fff;
            background: rgba(188, 19, 254, 0.1);
            box-shadow: 0 0 15px rgba(188, 19, 254, 0.2);
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        .cool-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .cool-card:hover {
            transform: translateY(-5px) scale(1.02);
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent-purple);
        }

        .card-cat {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--accent-purple);
            margin-bottom: 0.5rem;
            display: block;
        }

        .card-title {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
            color: #fff;
        }

        .card-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .coolness {
            margin-top: 1rem;
            color: #ffd700;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <a href="index.html" class="nav-back" style="position:absolute; top:2rem; left:2rem;">← Topに戻る</a>

        <header class="cool-header animate-fade-in">
            <span style="color: var(--accent-purple); font-weight: bold;">AREA 4: THE COLLECTION</span>
            <h1 class="text-gradient">暗記したらかっこいいこと</h1>
            <p>実用性よりロマン。語りたくなる知識たち。</p>
        </header>

        <main>
            <!-- Filters -->
            <div class="filters animate-fade-in delay-100" id="filter-container">
                <button class="filter-btn active" data-filter="all">All</button>
                <!-- Buttons will be injected by JS -->
            </div>

            <!-- Grid -->
            <div class="card-grid animate-fade-in delay-200" id="grid">
                <div style="text-align: center; grid-column: 1/-1; padding: 3rem; color: var(--text-muted);">
                    データを読み込み中...
                </div>
            </div>
        </main>
    </div>

    <script>
        const SPREADSHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/1IN-PC0r_y6WHSQs1-Xklakj72LYm43q6xUspQ0KueXE/export?format=csv&gid=1782876609';
        let coolItems = [];
        const grid = document.getElementById('grid');
        const filterContainer = document.getElementById('filter-container');

        // Robust CSV Parser (handles quotes and newlines within cells)
        function parseCSV(text) {
            const result = [];
            let row = [];
            let field = '';
            let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const nextChar = text[i + 1];
                if (inQuotes) {
                    if (char === '"' && nextChar === '"') {
                        field += '"';
                        i++;
                    } else if (char === '"') {
                        inQuotes = false;
                    } else {
                        field += char;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                    } else if (char === ',') {
                        row.push(field);
                        field = '';
                    } else if (char === '\n' || char === '\r') {
                        row.push(field);
                        if (row.length > 1 || row[0] !== '') {
                            result.push(row);
                        }
                        row = [];
                        field = '';
                        if (char === '\r' && nextChar === '\n') {
                            i++;
                        }
                    } else {
                        field += char;
                    }
                }
            }
            if (row.length > 0 || field !== '') {
                row.push(field);
                result.push(row);
            }
            return result;
        }

        async function loadData() {
            try {
                const response = await fetch(SPREADSHEET_CSV_URL);
                if (!response.ok) throw new Error('Network response was not ok');
                const csvText = await response.text();
                const data = parseCSV(csvText);

                // Assuming Header: カテゴリー, タイトル, 解説, 内容, ...
                // skip header
                coolItems = data.slice(1).map((row, index) => ({
                    id: index,
                    cat: row[0] || 'その他',
                    title: row[1] || '無題',
                    desc: row[2] || '',
                    stars: 3 // Default stars as spreadsheet doesn't have it
                }));

                createFilters();
                render('all');
            } catch (error) {
                console.error('Fetch error:', error);
                grid.innerHTML = `<div style="text-align: center; grid-column: 1/-1; padding: 3rem; color: #ff5555;">データの読み込みに失敗しました。</div>`;
            }
        }

        function createFilters() {
            const cats = [...new Set(coolItems.map(i => i.cat))];
            
            // Re-render "All" then append others
            filterContainer.innerHTML = '<button class="filter-btn active" data-filter="all">All</button>';
            
            cats.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.dataset.filter = cat;
                btn.textContent = cat;
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    render(cat);
                });
                filterContainer.appendChild(btn);
            });

            // Re-bind "All"
            filterContainer.querySelector('[data-filter="all"]').addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                render('all');
            });
        }

        function render(filter) {
            grid.innerHTML = '';
            const items = filter === 'all' ? coolItems : coolItems.filter(i => i.cat === filter);

            if (items.length === 0) {
                grid.innerHTML = `<div style="text-align: center; grid-column: 1/-1; padding: 3rem; color: var(--text-muted);">アイテムがありません。</div>`;
                return;
            }

            items.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'cool-card animate-fade-in';
                div.style.animationDelay = `${index * 0.05}s`;
                div.innerHTML = `
                    <span class="card-cat">${item.cat}</span>
                    <h3 class="card-title">${item.title}</h3>
                    <p class="card-desc">${item.desc}</p>
                    <div class="coolness">重要度 ${'★'.repeat(item.stars)}${'☆'.repeat(5 - item.stars)}</div>
                `;
                grid.appendChild(div);
            });
        }

        // Init
        loadData();
    </script>
</body>

</html>
